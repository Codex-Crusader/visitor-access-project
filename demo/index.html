<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#16325B">
<meta name="description" content="Campus visitor entry: request a visit, track the approval, show your pass at the gate.">
<title>Campus Visitor Access</title>
<style>
:root{
 --ink:#0F1822;--soft:#5A6979;--faint:#94A2B1;--line:#E2E8EE;--paper:#fff;--mute:#F5F8FB;
 --brand:#16325B;--brand2:#27599C;--tint:#EDF2F9;
 --go:#0C6B47;--goBg:#E8F5EF;--goLn:#A8D8C3;
 --wait:#8A5710;--waitBg:#FDF4E6;--waitLn:#EBCE9E;
 --stop:#992724;--stopBg:#FBEDEB;--stopLn:#E9B6B0;
 --bg:#D9E1EA;--r:14px;--sh:0 1px 2px rgba(16,30,50,.06),0 1px 1px rgba(16,30,50,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A1017}}
:root[data-theme=dark]{--bg:#0A1017}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;height:100dvh;background:var(--bg);color:var(--ink);
 font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{width:100%;max-width:428px;height:100%;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px) and (min-height:720px){
 .app{height:calc(100vh - 44px);height:min(868px,calc(100vh - 44px));border-radius:30px;
  box-shadow:0 30px 70px rgba(10,22,38,.28),0 2px 8px rgba(10,22,38,.12)}
}
.brand{padding:16px 22px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand img{display:block;width:auto;height:26px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .brand img{filter:none}}
.nav{display:flex;align-items:center;gap:6px;padding:4px 14px 12px;border-bottom:1px solid var(--line)}
.nav h1{margin:0;font-size:1.02rem;font-weight:650;letter-spacing:-.01em}
.back{padding:8px;margin-left:-8px;color:var(--brand2);font-size:1.45rem;line-height:1;border-radius:10px}
.back:active{background:var(--tint)}
.view{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
 padding:20px 22px calc(34px + env(safe-area-inset-bottom))}

.hero{margin-bottom:22px}
h2{margin:0 0 6px;font-size:1.62rem;font-weight:750;letter-spacing:-.03em;line-height:1.16}
.heroP{margin:0;color:var(--soft);font-size:.96rem}
p{margin:0 0 14px;color:var(--soft)}
.sm{font-size:.88rem;color:var(--soft);line-height:1.5}

.btn{display:block;width:100%;padding:15px;border-radius:var(--r);background:var(--brand);color:#fff;
 font-weight:650;margin-top:12px;border:1px solid var(--brand);box-shadow:var(--sh);
 transition:transform .12s ease,background .12s ease}
.btn:active{transform:scale(.988);background:var(--brand2)}
.btn.alt{background:var(--paper);color:var(--brand);border-color:#C4D3E6}
.btn.alt:active{background:var(--tint)}
.btn.plain{background:var(--paper);color:var(--ink);border-color:var(--line);font-weight:600}
.btn.plain:active{background:var(--mute)}
a.btn{display:block;text-align:center;text-decoration:none}

.menu{display:grid;gap:9px}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;
 background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;font-weight:600;
 box-shadow:var(--sh);transition:border-color .12s ease,transform .12s ease}
.menu button:active{transform:scale(.99);border-color:var(--brand2)}
.menu i{font-style:normal;color:#A9B6C4;font-size:1.15rem}

.live{display:block;width:100%;text-align:left;border-radius:18px;padding:18px;margin-bottom:18px;color:#fff;
 background:linear-gradient(140deg,var(--brand),var(--brand2));box-shadow:0 6px 18px rgba(22,50,91,.22)}
.live b{display:block;font-size:1.18rem;font-weight:700;letter-spacing:-.01em}
.live span{font-size:.86rem;opacity:.82;letter-spacing:.02em}
.live[data-tone=go]{background:linear-gradient(140deg,#0C6B47,#13895C);box-shadow:0 6px 18px rgba(12,107,71,.22)}
.live[data-tone=stop]{background:linear-gradient(140deg,#992724,#C0403B);box-shadow:0 6px 18px rgba(153,39,36,.2)}

label{display:block;font-weight:650;font-size:.84rem;letter-spacing:.02em;margin:20px 0 7px;color:var(--ink)}
input,select{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--mute);
 font:inherit;color:inherit;-webkit-appearance:none;appearance:none;transition:border-color .12s,background .12s}
input:focus{background:var(--paper);border-color:var(--brand2);box-shadow:0 0 0 3px rgba(39,89,156,.12)}
input.bad{border-color:var(--stop);background:var(--stopBg)}
input.bad:focus{border-color:var(--stop);background:var(--stopBg);box-shadow:0 0 0 3px rgba(153,39,36,.14)}
.bad-note{color:var(--stop);font-size:.85rem;margin-top:7px;font-weight:600}
.steps{display:flex;gap:6px;margin-bottom:6px}
.steps i{height:4px;flex:1;background:var(--line);border-radius:3px;transition:background .2s}
.steps i.on{background:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-size:.92rem;
 background:var(--paper);font-weight:550;transition:all .12s ease}
.chips button[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
/* A group of buttons cannot take input.bad, so the group carries the red itself. */
.chips.bad button{border-color:var(--stopLn);background:var(--stopBg);color:var(--stop)}
.guest{display:flex;justify-content:space-between;align-items:center;background:var(--mute);
 border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:.94rem;font-weight:550}
.guest button{color:var(--stop);font-size:.84rem;font-weight:650;padding:4px}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1}
.add-row button{border:1px solid #C4D3E6;color:var(--brand);border-radius:12px;padding:0 20px;font-weight:650;background:var(--paper)}
.add-person{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:10px 14px;
 border:1px dashed #C4D3E6;border-radius:12px;color:var(--brand);font-weight:650;font-size:.94rem;background:var(--paper)}
.add-person .plus{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
 background:var(--brand);color:#fff;font-size:1.25rem;line-height:1;font-weight:600}

.state{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:16px;margin-bottom:20px;border:1px solid}
.state h3{margin:0 0 3px;font-size:1.14rem;font-weight:700;letter-spacing:-.01em}
.state p{margin:0;font-size:.92rem;color:inherit;opacity:.92}
.ic{width:22px;height:22px;flex:none;margin-top:2px}
.wait{background:var(--waitBg);border-color:var(--waitLn);color:var(--wait)}
.good{background:var(--goBg);border-color:var(--goLn);color:var(--go)}
.bad{background:var(--stopBg);border-color:var(--stopLn);color:var(--stop)}

.track{position:relative;margin:0 0 20px;padding:2px 0 0 32px;list-style:none}
.rail{position:absolute;left:8px;top:11px;bottom:18px;width:3px;background:var(--line);border-radius:2px;overflow:hidden}
.rail b{position:absolute;top:0;left:0;right:0;display:block;background:var(--brand2);border-radius:2px;transition:height .5s linear}
.track li{position:relative;padding:0 0 22px}
.track li::before{content:"";position:absolute;left:-32px;top:3px;width:19px;height:19px;border-radius:50%;
 background:var(--paper);border:3px solid var(--line)}
.track li[data-at=done]::before{background:var(--brand2);border-color:var(--brand2)}
.track li[data-at=now]::before{border-color:var(--brand2);box-shadow:0 0 0 5px rgba(39,89,156,.14);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(39,89,156,.05)}}
.track b.t{display:block;font-weight:650;font-size:.97rem}
.track span{font-size:.85rem;color:var(--soft)}

.facts{border:1px solid var(--line);border-radius:var(--r);padding:2px 16px;margin-bottom:18px;background:var(--paper);box-shadow:var(--sh)}
.facts div{display:flex;justify-content:space-between;gap:14px;padding:13px 0;font-size:.93rem;border-bottom:1px solid var(--line)}
.facts div:last-child{border:0}
.facts span{color:var(--soft)}
.facts b{text-align:right;font-weight:650}

.pass{border:1px solid var(--line);border-radius:18px;padding:26px 20px 20px;text-align:center;margin-bottom:18px;
 background:var(--paper);box-shadow:0 8px 24px rgba(16,30,50,.1)}
.ptop{display:block;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.pass b{display:block;margin:10px 0 18px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 font-size:2.3rem;letter-spacing:.07em;font-weight:700}
.pass-cut{display:block;height:1px;margin:0 -20px 14px;background:repeating-linear-gradient(90deg,var(--line) 0 7px,transparent 7px 14px)}
.pass-foot{font-size:.88rem;color:var(--soft)}

.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:76px auto 16px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sheet{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(9,18,30,.44);display:flex;align-items:flex-end;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.box{background:var(--paper);width:100%;border-radius:22px 22px 0 0;padding:24px 22px calc(26px + env(safe-area-inset-bottom));animation:rise .22s ease}
@keyframes rise{from{transform:translateY(14px)}}
.wrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
</style>
</head>

<script>

const REF="VR-4821",ESC=30,DEC=40;
const REASONS=["See a student","See an office","Delivery","Event","Other"];
const MAX_GUESTS=10;
const S={s:"home",min:804,f:{name:"",phone:"",address:"",reason:"",other:"",visiting:"",guest:""},g:[],e:{},
  adding:0,sent:null,st:"none",hist:[],sheet:0};
const hm=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const el=i=>document.getElementById(i);
const x=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const set=(k,v)=>{S.f[k]=v;if(S.e[k]){delete S.e[k];unmark(k)}};

setInterval(()=>{if(S.s!=="sending")tick(1)},520);
function tick(n){
  S.min+=n;
  if(S.sent!==null){
    const d=S.min-S.sent;
    if(S.st==="waiting"&&d>=ESC)S.st="escalated";
    if(S.st==="escalated"&&d>=DEC)S.st="approved";
  }
  const c=el("clock"); if(c)c.textContent=hm(S.min);
  if(S.s==="status"||S.s==="home")render();
}
function go(s,keep=1){if(keep)S.hist.push(S.s);S.s=s;S.sheet=0;render();el("view").scrollTop=0}
function back(){S.s=S.hist.pop()||"home";S.sheet=0;render()}

const T={home:["",0],step1:["Request a Visit",1],step2:["Request a Visit",1],review:["Review",1],sending:["",0],
  status:["Checking on My Request",1],inout:["Getting In and Out",1],privacy:["My Information and Privacy",1],help:["Getting Help",1]};
const word=()=>({waiting:"Not approved yet",escalated:"Not approved yet",approved:"Approved",declined:"Declined"}[S.st]||"");
const reasonText=()=>S.f.reason==="Other"?(S.f.other.trim()||"Other"):S.f.reason;
const ICONS={
 check:'<path d="M20 6 9 17l-5-5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 cross:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>'};
const ico=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const fact=(k,v)=>`<div><span>${k}</span><b>${x(v||"—")}</b></div>`;
// The class goes in the markup. The two aria attributes are added after
// the markup is in the page, by mark(), so the template stays valid HTML.
const flag=k=>S.e[k]?"bad":"";
const note=k=>S.e[k]?`<div class="bad-note" id="e_${k}">${x(S.e[k])}</div>`:"";
const DESK="+912200000000", DESK_SHOWN="+91 22 0000 0000";
const gate=()=>`<a class="btn plain" href="tel:${DESK}">Call gate desk</a>`;
// A "+" button first. Pressing it opens a box for one more name. Adding the
// name closes the box and brings the "+" back. It goes away at ten people.
const guestBox=()=>S.adding
  ?`<div class="add-row"><input id="f_guest" class="${flag("guest")}" value="${x(S.f.guest)}"
      oninput="set('guest',this.value)" placeholder="Their name" aria-label="Name of the person with you" enterkeyhint="done">
      <button onclick="add()">Add</button></div>${note("guest")}`
  :S.g.length<MAX_GUESTS
    ?`<button type="button" class="add-person" id="more" onclick="openAdd()"><span class="plus" aria-hidden="true">+</span>Add a person</button>`
    :"";

// How far the blue line has run down the tracker. mark() writes it on to the
// bar after the markup is in the page, so the template holds no computed CSS.
function railPct(){
  const d=S.min-S.sent;
  return S.st==="approved"?100:Math.min(100,(d/DEC)*100);
}

function tracker(){
  const esc=S.st==="escalated"||S.st==="approved", done=S.st==="approved";
  return `<ul class="track"><span class="rail"><b></b></span>
    <li data-at="done"><b class="t">Request sent</b><span>${hm(S.sent)}</span></li>
    <li data-at="${esc?"done":"now"}"><b class="t">First approver, Desk 1</b>
      <span>${esc?"No answer by "+hm(S.sent+ESC):"Opened, no decision yet"}</span></li>
    ${esc?`<li data-at="${done?"done":"now"}"><b class="t">Backup approver, Desk 2</b><span>Took over at ${hm(S.sent+ESC)}</span></li>`:""}
    <li data-at="${done?"done":""}"><b class="t">Decision</b><span>${done?"Approved at "+hm(S.sent+DEC):"Not yet"}</span></li>
  </ul>`;
}

function view(){
  const d=S.sent===null?0:S.min-S.sent, left=Math.max(0,ESC-d);
  switch(S.s){
  case "home": return `<div class="hero"><h2>Campus Visitor Access</h2><p class="heroP">Ask to visit, then watch the decision happen.</p></div>
    ${S.st!=="none"?`<button class="live ${S.st==="approved"?"go":S.st==="declined"?"stop":""}" onclick="go('status')">
      <b>${word()}</b><span>${REF}</span></button>`:""}
    <div class="menu">
      <button onclick="go('step1')">Request a Visit<i>›</i></button>
      <button onclick="go('status')">Checking on My Request<i>›</i></button>
      <button onclick="go('inout')">Getting In and Out<i>›</i></button>
      <button onclick="go('privacy')">My Information and Privacy<i>›</i></button>
      <button onclick="go('help')">Getting Help<i>›</i></button>
    </div>`;

  case "step1": return `<div class="steps"><i class="on"></i><i></i></div>
    <label for="f_name">Your name</label>
    <input id="f_name" class="${flag("name")}" value="${x(S.f.name)}" oninput="set('name',this.value)">
    ${note("name")}
    <label for="f_phone">Phone</label>
    <input id="f_phone" inputmode="numeric" class="${flag("phone")}" value="${x(S.f.phone)}" oninput="set('phone',this.value)">
    ${note("phone")}
    <label for="f_address">Address</label>
    <input id="f_address" class="${flag("address")}" value="${x(S.f.address)}" oninput="set('address',this.value)">
    ${note("address")}
    <button class="btn" onclick="n1()">Continue</button>
    <button class="btn plain" onclick="S.sheet=1;render()">Finish later</button>`;

  case "step2":
    return `<div class="steps"><i class="on"></i><i class="on"></i></div>
    <label>Reason</label>
    <div class="chips ${S.e.reason?"bad":""}" id="f_reason">${REASONS.map(r=>
      `<button type="button" aria-pressed="false" onclick="pick('${r}')">${r}</button>`).join("")}</div>
    ${note("reason")}
    ${S.f.reason==="Other"?`<input id="f_other" style="margin-top:10px" class="${flag("other")}" value="${x(S.f.other)}" oninput="set('other',this.value)" placeholder="Say briefly why">
      ${note("other")}`:""}
    <label for="f_visiting">Who are you visiting?</label>
    <input id="f_visiting" class="${flag("visiting")}" value="${x(S.f.visiting)}" oninput="set('visiting',this.value)" placeholder="Student name or roll number">
    ${note("visiting")}
    ${S.e.visiting===STAFF
      ?`<p class="sm">Staff no longer approve visits. Name the student you are seeing.</p>
        <button class="btn plain" onclick="roll()">Use a roll number</button>`
      :`<p class="sm">We pick the approver for you.</p>`}
    <label>Anyone with you?</label>
    ${S.g.map((g,i)=>`<div class="guest">${x(g)}<button onclick="drop(${i})">Remove</button></div>`).join("")}
    ${guestBox()}
    <button class="btn" onclick="n2()">${S.st==="none"?"Review":"Save changes"}</button>
    ${S.st==="none"?`<button class="btn plain" onclick="S.sheet=1;render()">Finish later</button>`:""}`;

  case "review": return `<div class="facts">
      ${fact("Name",S.f.name)}${fact("Phone",S.f.phone)}${fact("Address",S.f.address)}
      ${fact("Reason",reasonText())}${fact("Visiting",S.f.visiting)}${S.g.length?fact("With you",S.g.join(", ")):""}
    </div>
    <p class="sm">No answer in 30 minutes and it moves to a backup approver. You do not fill this in again.</p>
    <button class="btn" onclick="send()">Send request</button>
    <button class="btn plain" onclick="back()">Edit</button>`;

  case "sending": return `<div class="spin"></div><p style="text-align:center">Sending</p>`;

  case "status":{
    if(S.st==="none") return `<h2>Nothing sent yet</h2><button class="btn" onclick="go('step1')">Request a Visit</button>`;
    if(S.st==="declined") return `<div class="state bad">${ico("cross")}<div><h3>Declined</h3><p>The student you named is not on campus today.</p></div></div>
      <div class="facts">${fact("Reference",REF)}${fact("Decided",hm(S.min))}</div>
      <button class="btn" onclick="again()">New request</button>${gate()}`;
    if(S.st==="approved") return `<div class="state good"><h3>Approved</h3><p>Show your pass at the gate.</p></div>
      ${tracker()}<button class="btn" onclick="go('inout')">Open pass</button>${gate()}
      <button class="btn plain" onclick="home()">Go to home</button>`;
    return `<div class="state wait">${ico("clock")}<div><h3>Not approved yet</h3><p>Do not enter until this says Approved.</p></div></div>
      ${tracker()}
      <div class="facts">${fact("Reference",REF)}
        ${fact("With",S.st==="escalated"?"Backup approver, Desk 2":"First approver, Desk 1")}
        ${fact(S.st==="escalated"?"Decision by":"Backup takes over",S.st==="escalated"?hm(S.sent+DEC):hm(S.sent+ESC)+" · "+left+" min")}
        ${S.g.length?fact("With you",S.g.join(", ")):""}</div>
      <button class="btn alt" onclick="go('step2')">Add a visitor</button>${gate()}`;}

  case "inout":{
    if(S.st!=="approved") return `<h2>No pass yet</h2><p>Your pass appears here once a request is approved.</p>
      <button class="btn" onclick="go(S.st==='none'?'step1':'status')">${S.st==="none"?"Request a Visit":"Check my request"}</button>`;
    return `<div class="pass"><span class="ptop">Entry pass</span><b>${REF}</b>
      <span class="pass-cut"></span>
      <span class="pass-foot">${x(S.f.name||"Visitor")}${S.g.length?" +"+S.g.length:""} · today</span></div>
      <p class="sm">Show this at the gate. The guard looks it up. Saved on this phone, so it works without signal.</p>
      ${gate()}
      <button class="btn plain" onclick="home()">Go to home</button>`;}

  case "privacy": return `<h2>What we ask for</h2>
    <div class="facts">${["Name","Phone","Address","Reason","Who you are visiting"].map(i=>`<div><span>${i}</span></div>`).join("")}</div>
    <p class="sm">No selfie, no ID number, no vehicle number. Deleted after your visit day.</p>`;

  case "help": return `<h2>Getting help</h2>
    <div class="facts">${fact("Gate desk",DESK_SHOWN)}</div>
    ${gate()}`;
  }
  return "";
}

// Continue and Review check every field, not just the phone number. Each
// wrong field turns light red and says what is wrong, and they all light up
// together rather than one per press.
const MAX=200;
const STAFF="Name a student, not a staff member.";
const STEP1=["name","phone","address"];
const STEP2=["reason","other","visiting","guest"];
// Line breaks, control codes, invisible marks and the overrides that make
// text run the other way. They are not part of a name or an address.
const NOT_TEXT=/[\p{C}\p{Zl}\p{Zp}]/u;
const tidy=t=>String(t||"").trim().replace(/\s+/g," ");

function needed(key,label){
  const raw=S.f[key]||"";
  if(raw.length>MAX)return `${label} is too long. Use ${MAX} characters or fewer.`;
  if(NOT_TEXT.test(raw))return `${label} has characters that are not allowed.`;
  if(!tidy(raw))return `${label} is required.`;
  return "";
}

function unmark(key){
  const box=el("f_"+key);
  if(box){box.classList.remove("bad");box.removeAttribute("aria-invalid");box.removeAttribute("aria-describedby")}
  const message=el("e_"+key);
  if(message)message.remove();
}

function settle(keys,found){
  keys.forEach(k=>delete S.e[k]);
  Object.assign(S.e,found);
  const first=keys.find(k=>S.e[k]);
  if(!first)return true;
  render();
  const box=el("f_"+first);
  if(box){box.scrollIntoView({block:"nearest"});box.focus()}
  return false;
}

function n1(){
  const found={};
  const name=needed("name","Your name");
  if(name)found.name=name;

  const phone=needed("phone","Phone");
  if(phone)found.phone=phone;
  else if(tidy(S.f.phone).replace(/\D/g,"").length!==10)found.phone="Enter 10 digits.";

  const address=needed("address","Address");
  if(address)found.address=address;

  if(!settle(STEP1,found))return;
  STEP1.forEach(k=>S.f[k]=tidy(S.f[k]));
  go("step2");
}

function n2(){
  const found={};
  if(!S.f.reason)found.reason="Choose a reason for the visit.";
  else if(S.f.reason==="Other"){
    const other=needed("other","A short reason");
    if(other)found.other=other;
  }

  if(!tidy(S.f.visiting))found.visiting="Name the student you are visiting.";
  else{
    const who=needed("visiting","This");
    if(who)found.visiting=who;
    else if(/prof|dr[.]|sir|madam/i.test(S.f.visiting))found.visiting=STAFF;
  }

  // A name typed in the open box but not added yet still counts.
  const typed=S.adding&&tidy(S.f.guest)?needed("guest","That name"):"";
  if(typed)found.guest=typed;

  if(!settle(STEP2,found))return;
  if(S.adding&&tidy(S.f.guest))S.g.push(tidy(S.f.guest));
  closeAdd();
  S.f.other=tidy(S.f.other);
  S.f.visiting=tidy(S.f.visiting);
  if(S.st==="none")go("review");
  else back();
}

function pick(r){
  S.f.reason=r;
  delete S.e.reason;
  if(r!=="Other")S.f.other="";
  else delete S.e.other;
  render();
  if(r==="Other"){const i=el("f_other");if(i)i.focus()}
}

function roll(){S.f.visiting="2024SEPVUGP0003";delete S.e.visiting;render()}

function openAdd(){
  S.adding=1;
  render();
  const box=el("f_guest");
  if(box)box.focus();
}
function closeAdd(){S.adding=0;S.f.guest="";delete S.e.guest}
// Adds the name in the box. An empty box just closes again.
function add(){
  const v=tidy(S.f.guest);
  if(v){
    const bad=needed("guest","That name");
    if(bad){settle(["guest"],{guest:bad});return}
    if(S.g.length<MAX_GUESTS)S.g.push(v);
  }
  closeAdd();
  render();
  const more=el("more");
  if(more)more.focus();
}
function drop(i){S.g.splice(i,1);render()}
function send(){go("sending");setTimeout(()=>{S.sent=S.min;S.st="waiting";S.hist=["home"];go("status",0)},1100)}
function home(){S.s="home";S.hist=[];S.sheet=0;render();el("view").scrollTop=0}
function again(){S.st="none";S.sent=null;S.g=[];closeAdd();S.e={};go("step2",0)}

// Everything render() cannot put in the markup: attributes that come and go,
// a height that is a number, and the two handlers that need their own event.
function mark(){
  Object.keys(S.f).forEach(k=>{
    const box=el("f_"+k);
    if(!box)return;
    if(S.e[k]){box.setAttribute("aria-invalid","true");box.setAttribute("aria-describedby","e_"+k)}
    else{box.removeAttribute("aria-invalid");box.removeAttribute("aria-describedby")}
  });
  const chips=el("f_reason");
  if(chips)chips.querySelectorAll("button").forEach((n,i)=>
    n.setAttribute("aria-pressed",String(S.f.reason===REASONS[i])));
  const bar=document.querySelector(".rail b");
  if(bar)bar.style.height=railPct()+"%";
  const guest=el("f_guest");
  if(guest)guest.onkeydown=e=>{
    if(e.key==="Enter")add();
    else if(e.key==="Escape"){closeAdd();render();const more=el("more");if(more)more.focus()}
  };
  const sheet=document.querySelector(".sheet");
  if(sheet)sheet.onclick=e=>{if(e.target===sheet){S.sheet=0;render()}};
}

function render(){
  const [t,b]=T[S.s]||["",0];
  el("nav").innerHTML=(b?`<button class="back" onclick="back()">‹</button>`:"")+(t?`<h1>${t}</h1>`:"");
  el("view").innerHTML=view();
  el("over").innerHTML=S.sheet?`<div class="sheet">
    <div class="box"><h2>Finish later?</h2><p>Everything you typed is saved. Nothing is sent.</p>
    <button class="btn plain" onclick="S.sheet=0;render()">Keep filling</button>
    <button class="btn alt" onclick="S.sheet=0;S.s='home';S.hist=[];render()">Save and exit</button></div></div>`:"";
  mark();
}
addEventListener("keydown",e=>{
  if(e.target.closest("input,select,textarea")||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="d"&&S.st!=="none"){S.st="declined";go("status",0)}
  if(e.key==="t")tick(10);
  if(e.key==="r")location.reload();
});
render();

</script>
</body>
