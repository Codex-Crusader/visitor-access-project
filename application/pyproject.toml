[project]
name = "visitor-access-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "requests",
    "python-dotenv",
    # The host runs the app under gunicorn. requirements.txt lists it too,
    # and the two files have to agree.
    "gunicorn",
    "psycopg[binary]",
    "psycopg-pool",
]

[dependency-groups]
# The tests start a throwaway Postgres from this package. The app never uses it.
dev = ["pgserver"]
