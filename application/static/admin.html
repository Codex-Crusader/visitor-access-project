<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#16325B">
<meta name="robots" content="noindex">
<meta name="description" content="Admin: every visitor request, its status and its approvers.">
<title>Visitor Admin</title>
<style>
:root{
 --ink:#0F1822;--soft:#5A6979;--faint:#94A2B1;--line:#E2E8EE;--paper:#fff;--mute:#F5F8FB;
 --brand:#16325B;--brand2:#27599C;--tint:#EDF2F9;
 --go:#0C6B47;--goBg:#E8F5EF;--goLn:#A8D8C3;
 --wait:#8A5710;--waitBg:#FDF4E6;--waitLn:#EBCE9E;
 --stop:#992724;--stopBg:#FBEDEB;--stopLn:#E9B6B0;
 --bg:#D9E1EA;--r:14px;--sh:0 1px 2px rgba(16,30,50,.06),0 1px 1px rgba(16,30,50,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* A class that sets display would otherwise beat the hidden attribute. */
[hidden]{display:none!important}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
 font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 -webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* The same card, logo bar and title row as the visitor page, wider for the tables. */
.app{max-width:960px;margin:0 auto;background:var(--paper);min-height:100dvh}
@media(min-width:1000px){.app{margin:22px auto;min-height:auto;border-radius:30px;overflow:hidden;
 box-shadow:0 30px 70px rgba(10,22,38,.28),0 2px 8px rgba(10,22,38,.12)}}
.brand{padding:16px 22px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand img{display:block;width:auto;height:26px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
 padding:12px 22px;border-bottom:1px solid var(--line)}
.nav h1{margin:0;font-size:1.02rem;font-weight:650;letter-spacing:-.01em}
.nav small{display:block;color:var(--soft);font-size:.8rem}
.nav nav{display:flex;gap:8px;flex-wrap:wrap}
.nav nav button{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
 font-size:.84rem;font-weight:600;box-shadow:var(--sh)}
.nav nav button:active{background:var(--mute)}
.main{padding:20px 22px 40px}
.hero{margin-bottom:20px}
.hero h2{margin:0 0 6px;font-size:1.62rem;font-weight:750;letter-spacing:-.03em;line-height:1.16}
.hero p{margin:0;color:var(--soft);font-size:.96rem}

/* The tabs are the visitor page's reason chips. */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tabs button{border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:.92rem;
 background:var(--paper);font-weight:550;transition:all .12s ease}
.tabs button[aria-selected=true]{background:var(--brand);color:#fff;border-color:var(--brand)}

label{display:block;font-weight:650;font-size:.84rem;letter-spacing:.02em;margin:0 0 7px}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--mute);
 -webkit-appearance:none;appearance:none;transition:border-color .12s,background .12s}
input:focus{background:var(--paper);border-color:var(--brand2);outline:none;box-shadow:0 0 0 3px rgba(39,89,156,.12)}
.btn{display:block;width:100%;padding:15px;border-radius:var(--r);background:var(--brand);color:#fff;
 font-weight:650;margin-top:12px;border:1px solid var(--brand);box-shadow:var(--sh);
 transition:transform .12s ease,background .12s ease}
.btn:active{transform:scale(.988);background:var(--brand2)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.plain{background:var(--paper);color:var(--ink);border-color:var(--line);font-weight:600}
.btn.plain:active{background:var(--mute)}
.btn.stop{background:var(--stop);border-color:var(--stop)}
.btn.stop:active{background:#7E1F1D}
.keybox{max-width:428px}

.note{border-radius:var(--r);padding:14px 16px;margin:0 0 16px;border:1px solid;font-size:.93rem}
.note.bad{background:var(--stopBg);border-color:var(--stopLn);color:var(--stop)}
.note.good{background:var(--goBg);border-color:var(--goLn);color:var(--go)}
.note.alert{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tabs .count{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:999px;
 background:var(--stop);color:#fff;font-size:.76rem;font-weight:700;text-align:center}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin-bottom:18px}
.tile{padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);text-align:left;
 background:var(--paper);box-shadow:var(--sh);transition:border-color .12s ease}
.tile b{display:block;font-size:1.5rem;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.tile span{font-size:.82rem;color:var(--soft);font-weight:600}
.tile[aria-pressed=true]{background:var(--tint);border-color:var(--brand2);box-shadow:0 0 0 2px var(--brand2) inset}

.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.bar input{flex:1}
.found{color:var(--soft);font-size:.85rem;margin:0 0 10px}

.list{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:0}
summary{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) auto;gap:12px;align-items:center;
 padding:13px 16px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--mute)}
summary b{font-weight:650;overflow-wrap:anywhere}
summary small{display:block;color:var(--soft);font-size:.8rem;overflow-wrap:anywhere}
summary .side{text-align:right}
summary .by{margin-top:3px}
summary .by[data-tone=go]{color:var(--go)}
summary .by[data-tone=stop]{color:var(--stop)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:650;letter-spacing:.04em}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:700;
 border:1px solid;white-space:nowrap}
.pill[data-tone=wait]{background:var(--waitBg);border-color:var(--waitLn);color:var(--wait)}
.pill[data-tone=go]{background:var(--goBg);border-color:var(--goLn);color:var(--go)}
.pill[data-tone=stop]{background:var(--stopBg);border-color:var(--stopLn);color:var(--stop)}
.pill[data-tone=done]{background:var(--mute);border-color:var(--line);color:var(--soft)}
.more{padding:4px 16px 14px 16px;background:var(--mute);border-top:1px solid var(--line)}
.more dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:10px 0 0;font-size:.9rem}
.more dt{color:var(--soft)}
.more dd{margin:0;font-weight:600;overflow-wrap:anywhere}
@media(max-width:620px){
 summary{grid-template-columns:minmax(0,1fr) auto}
 summary .mid{display:none}
}
.empty{padding:16px;color:var(--soft)}

h2{margin:0 0 10px;font-size:1rem;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{color:var(--soft);font-weight:600;font-size:.8rem;background:var(--mute)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.hint{color:var(--soft);font-size:.85rem;margin:10px 0 0}
.small{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:.82rem;font-weight:600;
 background:var(--paper)}
.small.del{color:var(--stop);border-color:var(--stopLn);background:var(--stopBg)}
.small.del:active{background:#F6DCD8}
/* Button colours, one for each kind of action. The words stay, so colour is never alone.
   Green: approve or let in. Red: delete, decline or ban. Amber: a key. Blue: add or change. */
.btn.go{background:var(--go);border-color:var(--go);color:#fff}
.btn.go:active{background:#0A5A3C}
.btn.warn{background:var(--waitBg);border-color:var(--waitLn);color:var(--wait)}
.btn.warn:active{background:#F8E7C8}
.small.go{color:var(--go);border-color:var(--goLn);background:var(--goBg)}
.small.warn{color:var(--wait);border-color:var(--waitLn);background:var(--waitBg)}
.small.edit{color:var(--brand2);border-color:#C4D3E6;background:var(--tint)}
.nav nav button.warn{color:var(--wait);border-color:var(--waitLn);background:var(--waitBg)}
.nav nav button.edit{color:var(--brand2);border-color:#C4D3E6;background:var(--tint)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.pair,.trio,.quad{grid-template-columns:1fr}}
/* Tags: filter chips above a list, and tappable tags under a tag box. */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chips button{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:.88rem;
 background:var(--paper);font-weight:550}
.chips button span{color:var(--soft);font-weight:600;margin-left:2px}
.chips button[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.chips button[aria-pressed=true] span{color:#fff;opacity:.8}
.tagpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tagpick:empty{display:none}
.pick{border:1px dashed #C4D3E6;border-radius:999px;padding:5px 11px;font-size:.85rem;color:var(--brand);
 background:var(--paper);font-weight:600}
tr.group td{background:var(--tint);color:var(--brand);font-weight:700;font-size:.85rem}
.you.super{background:var(--goBg);color:var(--go)}
/* Bulk decisions: a tick box beside each waiting request, and the buttons for the selection. */
.pickrow{display:flex;border-bottom:1px solid var(--line)}
.pickrow:last-child{border-bottom:0}
.pickrow details{flex:1;min-width:0;border-bottom:0}
.tick{display:flex;padding:15px 0 0 14px;margin:0;cursor:pointer}
.tick input{width:20px;height:20px;padding:0;margin:0;-webkit-appearance:auto;appearance:auto;
 accent-color:var(--brand)}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 12px;padding:10px 12px;
 border:1px solid var(--line);border-radius:var(--r);background:var(--mute)}
.bulk span{color:var(--soft);font-size:.88rem;font-weight:600;flex:1}
.bulk .btn{width:auto;margin:0;padding:9px 16px}
tr.group td span{color:var(--soft);font-weight:600;margin-left:4px}
tr.more-row td{text-align:center;padding:14px}
.pair .btn{margin-top:0}
.err{color:var(--stop);font-size:.82rem;margin:5px 0 0;font-weight:600}
.err:empty{display:none}
h2.gap{margin-top:26px}
.more .ban{margin:14px 0 4px}
.shot img{display:block;max-width:100%;max-height:360px;margin-top:8px;border-radius:10px}
td.acts{white-space:nowrap;text-align:right}
td.acts .small+.small{margin-left:6px}
td .fixed{color:var(--soft);font-size:.85rem}
.you{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:.74rem;font-weight:700;
 background:var(--tint);color:var(--brand)}
code.key{display:block;margin:8px 0;padding:8px 10px;background:var(--paper);border-radius:8px;
 user-select:all;overflow-wrap:anywhere}

/* On a phone: one row of tabs and tiles that scroll sideways, and each table row as a card. */
@media(max-width:620px){
 .main{padding:16px 16px 32px}
 .nav{padding:12px 16px}
 .brand{padding:14px 16px 10px}
 .tabs,.tiles{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
  margin-left:-16px;margin-right:-16px;padding:2px 16px}
 .tabs::-webkit-scrollbar,.tiles::-webkit-scrollbar{display:none}
 .tabs button{flex:none}
 .tile{flex:none;min-width:92px;padding:10px 12px}
 .tile b{font-size:1.25rem}
 .wrap{overflow:visible;border:0;border-radius:0;box-shadow:none}
 .wrap thead{display:none}
 .wrap table,.wrap tbody,.wrap tr,.wrap td{display:block;width:100%}
 .wrap tr{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  margin-bottom:9px;padding:6px 0;background:var(--paper)}
 .wrap td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  border:0;padding:6px 14px;text-align:right;overflow-wrap:anywhere}
 .wrap td[data-label]::before{content:attr(data-label);flex:none;color:var(--soft);
  font-size:.8rem;font-weight:600;text-align:left}
 .wrap td[colspan]{display:block;text-align:left}
 .wrap td.acts{justify-content:flex-end;padding-top:10px}
 .wrap td.acts::before{display:none}
 .wrap tr.group{border:0;box-shadow:none;background:none;margin:16px 0 6px;padding:0}
 .wrap tr.group td{background:none;padding:0 2px}
 .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;
  padding:2px 16px}
 .chips::-webkit-scrollbar{display:none}
 .chips button{flex:none}
 .more dl{grid-template-columns:1fr}
 .more dd{margin-bottom:6px}
}

/* The "Are you sure?" box, as the visitor page's Finish later sheet. */
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:10;background:rgba(9,18,30,.44);
 display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.box{background:var(--paper);width:100%;max-width:428px;border-radius:22px 22px 0 0;
 padding:24px 22px calc(26px + env(safe-area-inset-bottom));animation:rise .22s ease}
@media(min-width:600px){.sheet{align-items:center}.box{border-radius:22px}}
@keyframes rise{from{transform:translateY(14px)}}
.box h2{margin:0 0 6px;font-size:1.3rem;font-weight:750;letter-spacing:-.02em}
.box p{margin:0 0 6px;color:var(--soft)}
</style>
</head>
