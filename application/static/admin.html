<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#16325B">
<meta name="robots" content="noindex">
<meta name="description" content="Admin: every visitor request, its status and its approvers.">
<title>Visitor Admin</title>
<style>
:root{
 --ink:#0F1822;--soft:#5A6979;--line:#E2E8EE;--paper:#fff;--mute:#F5F8FB;
 --brand:#16325B;--brand2:#27599C;--tint:#EDF2F9;--accent:#16325B;
 --go:#0C6B47;--goBg:#E8F5EF;--goLn:#A8D8C3;
 --wait:#8A5710;--waitBg:#FDF4E6;--waitLn:#EBCE9E;
 --stop:#992724;--stopBg:#FBEDEB;--stopLn:#E9B6B0;
 --bg:#D9E1EA;--r:14px;--sh:0 1px 2px rgba(16,30,50,.06),0 1px 1px rgba(16,30,50,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --ink:#E4EBF3;--soft:#93A3B5;--line:#243243;--paper:#111A24;--mute:#0C141D;
 --brand:#2A5DA3;--brand2:#7AA9EA;--tint:#16263A;--accent:#9CC0F2;
 --go:#5CCB9A;--goBg:#0F2A20;--goLn:#1F5A41;
 --wait:#EBB866;--waitBg:#2A2013;--waitLn:#5B4521;
 --stop:#F2958D;--stopBg:#2D1616;--stopLn:#6B2E2A;
 --bg:#070C12;--sh:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme=dark]{
 --ink:#E4EBF3;--soft:#93A3B5;--line:#243243;--paper:#111A24;--mute:#0C141D;
 --brand:#2A5DA3;--brand2:#7AA9EA;--tint:#16263A;--accent:#9CC0F2;
 --go:#5CCB9A;--goBg:#0F2A20;--goLn:#1F5A41;
 --wait:#EBB866;--waitBg:#2A2013;--waitLn:#5B4521;
 --stop:#F2958D;--stopBg:#2D1616;--stopLn:#6B2E2A;
 --bg:#070C12;--sh:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* A class that sets display would otherwise beat the hidden attribute. */
[hidden]{display:none!important}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
 font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 -webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}

.app{max-width:960px;margin:0 auto;background:var(--paper);min-height:100dvh}
@media(min-width:1000px){.app{margin:22px auto;min-height:auto;border-radius:22px;overflow:hidden;
 box-shadow:0 24px 60px rgba(10,22,38,.22),0 2px 8px rgba(10,22,38,.1)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
 padding:18px 22px 16px;color:#fff;background:linear-gradient(140deg,#16325B,#27599C)}
.top h1{margin:0;font-size:1.3rem;font-weight:750;letter-spacing:-.02em}
.top small{display:block;font-size:.8rem;opacity:.78}
.top nav{display:flex;gap:8px;flex-wrap:wrap}
.top nav button{padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;
 font-size:.84rem;font-weight:600}
.top nav button:hover{background:rgba(255,255,255,.22)}
.main{padding:20px 22px 40px}

label{display:block;font-weight:650;font-size:.84rem;margin:0 0 7px}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--mute)}
input:focus{background:var(--paper);border-color:var(--brand2);outline:none;box-shadow:0 0 0 3px rgba(39,89,156,.18)}
.btn{display:block;width:100%;padding:14px;border-radius:var(--r);background:var(--brand);color:#fff;
 font-weight:650;margin-top:12px;border:1px solid var(--brand);box-shadow:var(--sh)}
.btn.plain{background:var(--paper);color:var(--ink);border-color:var(--line);font-weight:600}
.keybox{max-width:420px}

.note{border-radius:var(--r);padding:14px 16px;margin:0 0 16px;border:1px solid;font-size:.93rem}
.note.bad{background:var(--stopBg);border-color:var(--stopLn);color:var(--stop)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:18px}
.tile{padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);text-align:left;
 background:var(--paper);box-shadow:var(--sh)}
.tile b{display:block;font-size:1.5rem;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.tile span{font-size:.82rem;color:var(--soft);font-weight:600}
.tile[aria-pressed=true]{border-color:var(--brand2);box-shadow:0 0 0 2px var(--brand2) inset}

.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.bar input{flex:1}
.found{color:var(--soft);font-size:.85rem;margin:0 0 10px}

.list{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:0}
summary{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) auto;gap:12px;align-items:center;
 padding:12px 16px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--mute)}
summary b{font-weight:650;overflow-wrap:anywhere}
summary small{display:block;color:var(--soft);font-size:.8rem;overflow-wrap:anywhere}
summary .side{text-align:right}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:650;letter-spacing:.04em}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:700;
 border:1px solid;white-space:nowrap}
.pill.pending,.pill.escalated{background:var(--waitBg);border-color:var(--waitLn);color:var(--wait)}
.pill.approved,.pill.inside{background:var(--goBg);border-color:var(--goLn);color:var(--go)}
.pill.declined{background:var(--stopBg);border-color:var(--stopLn);color:var(--stop)}
.pill.closed{background:var(--mute);border-color:var(--line);color:var(--soft)}
.more{padding:4px 16px 14px 16px;background:var(--mute);border-top:1px solid var(--line)}
.more dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:10px 0 0;font-size:.9rem}
.more dt{color:var(--soft)}
.more dd{margin:0;font-weight:600;overflow-wrap:anywhere}
@media(max-width:620px){
 summary{grid-template-columns:minmax(0,1fr) auto}
 summary .mid{display:none}
}
.empty{padding:16px;color:var(--soft)}

h2{margin:30px 0 10px;font-size:1rem;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{color:var(--soft);font-weight:600;font-size:.8rem}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.hint{color:var(--soft);font-size:.85rem;margin:10px 0 0}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><h1>Visitor Admin</h1><small>Every request, newest first</small></div>
    <nav id="nav" hidden>
      <button id="refresh">Refresh</button>
      <button id="csv">Download CSV</button>
      <button id="rekey">Change key</button>
    </nav>
  </header>
  <main class="main" id="main"></main>
</div>
<script src="admin.js"></script>
</body>
</html>
