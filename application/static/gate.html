<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#16325B">
<meta name="description" content="Gate desk: check a visitor pass, record entry and exit.">
<title>Gate Desk</title>
<style>
:root{
 --ink:#0F1822;--soft:#5A6979;--faint:#94A2B1;--line:#E2E8EE;--paper:#fff;--mute:#F5F8FB;
 --brand:#16325B;--brand2:#27599C;--tint:#EDF2F9;
 --go:#0C6B47;--goBg:#E8F5EF;--goLn:#A8D8C3;
 --wait:#8A5710;--waitBg:#FDF4E6;--waitLn:#EBCE9E;
 --stop:#992724;--stopBg:#FBEDEB;--stopLn:#E9B6B0;
 --bg:#D9E1EA;--r:14px;--sh:0 1px 2px rgba(16,30,50,.06),0 1px 1px rgba(16,30,50,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* A class that sets display would otherwise beat the hidden attribute. */
[hidden]{display:none!important}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
 font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* The same card, logo bar and title row as the visitor page. */
.app{width:100%;max-width:428px;background:var(--paper);min-height:100dvh}
@media(min-width:600px) and (min-height:720px){
 .app{margin:22px 0;min-height:auto;align-self:flex-start;border-radius:30px;overflow:hidden;
  box-shadow:0 30px 70px rgba(10,22,38,.28),0 2px 8px rgba(10,22,38,.12)}
}
.brand{padding:16px 22px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand img{display:block;width:auto;height:26px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:12px 22px;border-bottom:1px solid var(--line)}
.nav h1{margin:0;font-size:1.02rem;font-weight:650;letter-spacing:-.01em}
.live{display:flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;border:1px solid var(--goLn);
 background:var(--goBg);color:var(--go);font-size:.8rem;font-weight:650;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:currentColor}
.live.off{background:var(--waitBg);border-color:var(--waitLn);color:var(--wait)}
.view{padding:20px 22px calc(34px + env(safe-area-inset-bottom))}
.hero{margin-bottom:20px}
.hero h2{margin:0 0 6px;font-size:1.62rem;font-weight:750;letter-spacing:-.03em;line-height:1.16}
.sub{margin:0 0 14px;color:var(--soft);font-size:.96rem}
.hero .sub{margin:0}

label{display:block;font-weight:650;font-size:.84rem;letter-spacing:.02em;margin:0 0 7px}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--mute);
 font:inherit;color:inherit;-webkit-appearance:none;appearance:none;transition:border-color .12s,background .12s;
 text-transform:uppercase;letter-spacing:.08em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 font-size:1.3rem;text-align:center}
input:focus{background:var(--paper);border-color:var(--brand2);outline:none;box-shadow:0 0 0 3px rgba(39,89,156,.12)}
input.key{text-transform:none;letter-spacing:normal;font-size:1rem;text-align:left;font-family:inherit}
.btn{display:block;width:100%;padding:15px;border-radius:var(--r);background:var(--brand);color:#fff;
 font-weight:650;margin-top:12px;border:1px solid var(--brand);box-shadow:var(--sh);
 transition:transform .12s ease,background .12s ease}
.btn:active{transform:scale(.988);background:var(--brand2)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.go{background:var(--go);border-color:var(--go)}
.btn.plain{background:var(--paper);color:var(--ink);border-color:var(--line);font-weight:600}
.btn.plain:active{background:var(--mute)}
label.btn{text-align:center;cursor:pointer;margin-top:12px}
.shot{display:block;width:100%;max-height:340px;object-fit:contain;margin:12px 0 0;
 border-radius:var(--r);background:var(--mute);border:1px solid var(--line)}

.state{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:16px;margin:20px 0 16px;border:1px solid}
.state h2{margin:0 0 3px;font-size:1.14rem;font-weight:700;letter-spacing:-.01em}
.state p{margin:0;font-size:.92rem;opacity:.92}
.ic{width:22px;height:22px;flex:none;margin-top:2px}
.good{background:var(--goBg);border-color:var(--goLn);color:var(--go)}
.wait{background:var(--waitBg);border-color:var(--waitLn);color:var(--wait)}
.bad{background:var(--stopBg);border-color:var(--stopLn);color:var(--stop)}
.spin{width:22px;height:22px;flex:none;border:3px solid currentColor;border-top-color:transparent;
 border-radius:50%;animation:sp .8s linear infinite;opacity:.8}
@keyframes sp{to{transform:rotate(360deg)}}

.facts{border:1px solid var(--line);border-radius:var(--r);padding:2px 16px;margin-bottom:18px;
 background:var(--paper);box-shadow:var(--sh)}
.facts div{display:flex;justify-content:space-between;gap:14px;padding:13px 0;font-size:.93rem;border-bottom:1px solid var(--line)}
.facts div:last-child{border:0}
.facts span{color:var(--soft)}
.facts b{text-align:right;font-weight:650;overflow-wrap:anywhere}

/* The board: who is inside now and who is expected, as the visitor page's menu cards. */
.sec{display:flex;align-items:center;gap:8px;margin:28px 0 10px;font-size:1rem;font-weight:700}
.count{min-width:26px;padding:1px 8px;border-radius:999px;background:var(--tint);color:var(--brand);
 font-size:.85rem;text-align:center}
.list{display:grid;gap:9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;
 padding:14px 16px;text-align:left;background:var(--paper);border:1px solid var(--line);
 border-radius:var(--r);box-shadow:var(--sh);transition:border-color .12s ease,transform .12s ease}
.row:active{transform:scale(.99);border-color:var(--brand2)}
.row>span:first-child{min-width:0}
.row small{display:block;color:var(--soft);font-size:.82rem;font-weight:500;overflow-wrap:anywhere}
.row b{font-weight:650;overflow-wrap:anywhere}
.row .side{text-align:right;flex-shrink:0}
.row code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:650;letter-spacing:.04em}
.row[data-long=true]{background:var(--waitBg);border-color:var(--waitLn)}
.row[data-long=true] .side small{color:var(--wait);font-weight:650}
.row[data-banned=true]{background:var(--stopBg);border-color:var(--stopLn)}
.row[data-banned=true] .side small{color:var(--stop);font-weight:700}
.empty{padding:14px 16px;color:var(--soft);font-size:.93rem;border:1px dashed var(--line);border-radius:var(--r)}
.updated{margin:10px 0 0;color:var(--soft);font-size:.82rem}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.tools .btn{margin:0;padding:13px 10px;font-size:.92rem}
</style>
</head>

  <main class="view">
    <div class="hero"><h2>Check a pass</h2><p class="sub" id="sub">Type the code on the visitor's pass.</p></div>
    <div id="entry" hidden>
      <label for="code">Pass code or allow list code</label>
      <input id="code" placeholder="KT-4821" autocomplete="off" autocapitalize="characters"
             spellcheck="false" inputmode="text" enterkeyhint="go">
      <button class="btn" id="look">Check</button>
    </div>
    <div id="out"></div>
    <div id="board" hidden></div>
    <div id="tools" class="tools" hidden>
      <button class="btn plain" id="refresh">Refresh the lists</button>
      <button class="btn plain" id="rekey">Change gate key</button>
    </div>
  </main>
</div>
<script src="shared.js"></script>
<script src="gate.js"></script>
</body>
