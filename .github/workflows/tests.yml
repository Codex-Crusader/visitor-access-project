# Runs every test on every push and pull request. A red run means do not deploy.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the oldest version pyproject.toml allows. 3.14 is what Render runs.
        python: ["3.11", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      # Each test script expects an empty database of its own.
      - name: Make one empty database per test script
        env:
          PGPASSWORD: postgres
        run: |
          for name in app_test concurrency_test; do
            psql -h localhost -U postgres -c "CREATE DATABASE $name"
          done
      - name: test_app.py
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
        run: python test_app.py
      - name: test_concurrency.py
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/concurrency_test
        run: python test_concurrency.py

  pages:
    name: Page tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: ruff
        working-directory: application
        run: |
          pip install ruff==0.16.2
          ruff check .
      - name: Install jsdom
        working-directory: application
        run: npm install --no-audit --no-fund
      - name: test_form.js
        working-directory: application
        run: node test_form.js
      - name: eslint
        working-directory: application
        run: npx --yes eslint@10.12.0 static test_form.js
      - name: test_demo.js
        env:
          NODE_PATH: application/node_modules
        run: node test_demo.js
