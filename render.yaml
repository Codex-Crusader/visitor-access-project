# The live service, visitor-access-sg, has these settings. It was made by hand
# in the Render dashboard, and no Blueprint is connected, so Render does not
# read this file. Use it as the record of the settings, or to make a Blueprint.
services:
  - type: web
    name: visitor-access-sg
    runtime: python
    plan: free
    # Next to the Neon database, and the nearest region to the campus.
    region: singapore
    # The app lives in application/, not at the repository root.
    rootDir: application
    buildCommand: pip install -r requirements.txt
    # One worker only. The escalation timer is a thread inside the process,
    # so a second worker would send every backup message twice.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    envVars:
      - key: META_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: MAIN_APPROVER
        sync: false
      - key: BACKUP_APPROVER
        sync: false
      - key: GUARD
        sync: false
      - key: GATE_KEY
        sync: false
      # Different from GATE_KEY. Without it, the admin page stays locked.
      - key: ADMIN_KEY
        sync: false
      # Optional. Each reason's main and backup approver, as JSON.
      - key: APPROVERS
        sync: false
      - key: GATE_DESK_PHONE
        sync: false
      # The Neon connection string. Visits live there, so they stay when Render deploys again.
      - key: DATABASE_URL
        sync: false
      - key: ESCALATE_MINUTES
        value: "15"
      - key: RETAIN_DAYS
        value: "90"
      # A proxy sits in front on Render, so read the caller's address from the
      # last entry of X-Forwarded-For rather than trusting the first.
      - key: BEHIND_PROXY
        value: "true"
      - key: REQUESTS_PER_HOUR
        value: "60"
